<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Acesso administrativo — 608 Flores e Floricultura</title>
    <link rel="stylesheet" href="../../STYLE/style.css">
</head>
<body class="login-page pagina-acesso">
    <div class="cartao-acesso">
        <a href="../index.html" class="cartao-acesso-voltar">← Voltar para o site</a>
        <h1 id="titulo-admin" style="font-size: 1.6rem;">Acesso administrativo</h1>
        <form id="form-admin" class="formulario-acesso ativo">
            <div class="campo"><label for="email-admin">E-mail</label><input type="email" id="email-admin" autocomplete="username" required></div>
            <div class="campo campo-senha"><label for="senha-admin">Senha</label><input type="password" id="senha-admin" autocomplete="current-password" minlength="8" required><button type="button" class="alterna-senha" data-campo="senha-admin">mostrar</button></div>
            <button type="submit" id="botao-admin" class="botao botao--primario botao--bloco">Entrar</button>
            <p class="mensagem-acesso" id="mensagem-admin"></p>
        </form>
    </div>
    <script src="../../SCRIPTS/produtos.js"></script>
    <script src="../../SCRIPTS/dados.js"></script>
    <script src="../../SCRIPTS/script.js"></script>
    <script src="../../SCRIPTS/login.js"></script>
    <script src="../../SCRIPTS/auth-admin.js"></script>
</body>
</html>
